[profile]
tool = "shortcut"
description = "Shortcut stories via the Shortcut REST API"

[defaults]
team = ""
owner = ""
# Whether stories the owner only requested (but doesn't own) are in scope too.
include_requested = true
triage_state = "To Do"
in_progress_state = "In Development"
done_state = "Done"
ready_label = "ai-ready"
assist_label = "ai-assist"
human_label = "ai-human"
priority_label = "ai-priority"
# Member ids whose requested stories go first, ahead of priority_label, in order.
priority_requesters = []
skip_label = "no-ai"
epic_id = ""
exclude_epics = []
# Objectives whose stories (in every epic, current and future) no daemon touches.
exclude_objectives = []
