[daemon]
backend = "claude"
# Cheap poller: every tick reads the watch channel via the Slack MCP (no
# bash-side Slack credential exists, so the gate IS the session — keep it on
# a small model). No discover.sh on purpose: run.sh launches every tick.
model = "haiku"
schedule = { interval = 180 }
command = "/slack-channel-watch"
stuck_after = 600
required_inputs = ["watch_channel_id"]

[inputs]
# Channel treated as the command inbox: every new top-level message is a
# command. Use a dedicated channel — thread replies are ignored.
watch_channel_id = "CHANGE_ME"
watch_channel_name = "CHANGE_ME"
# Daemon whose inbox receives the commands (the plugin engine).
target = "slack-commands"
