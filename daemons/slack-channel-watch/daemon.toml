[daemon]
backend = "claude"
model = "haiku"
# Without token_command every tick is a short-lived haiku session that just
# reads the channels — add this daemon to [budget].exempt in your daimon.toml
# so those polls don't consume the fleet's launch budget. With token_command
# set, discover.sh polls in script (free, unbudgeted) and 30s is fine.
schedule = { interval = 120 }
command = "/slack-channel-watch"
stuck_after = 600
required_inputs = ["watch_channels"]

[inputs]
# Channel IDs to watch. Only top-level messages starting with trigger_prefix
# are commands, so mixed-purpose channels (squad chat, feeds) are safe to
# watch — everything else is ignored.
watch_channels = ["CHANGE_ME"]
trigger_prefix = "?"
# Daemon whose inbox receives the commands (the plugin engine).
target = "slack-commands"
# Command that prints a Slack token with channels:history/groups:history read
# scope (e.g. `security find-generic-password -s slack-watch -w`, a doppler
# get, or an env echo). When set, discover.sh polls and forwards entirely in
# script and NO watcher agent ever launches — the model only runs to execute
# actual commands. Empty = agent-based MCP polling fallback (costlier).
token_command = ""
