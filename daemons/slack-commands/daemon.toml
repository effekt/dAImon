[daemon]
backend = "claude"
# Inbox-driven: the env-bridge Slack app queues a message and nudges
# `daimon run slack-commands`; the inbox gate launches immediately. The
# schedule is only a fallback sweep for messages queued while a run was
# already in flight.
schedule = { interval = 900 }
command = "/slack-commands"
stuck_after = 1800

[inputs]
# Command plugins: one markdown runbook per command. Shared plugins are
# committed; local_commands_dir (gitignored) holds personal/company runbooks
# and overrides shared ones on name conflict. Paths relative to install root.
commands_dir = "daemons/slack-commands/commands"
local_commands_dir = "daemons/slack-commands/commands.local"
# Slack user IDs allowed to run plugins marked `mutating: true`. Empty =
# nobody can run mutating commands.
mutate_allowlist = []
